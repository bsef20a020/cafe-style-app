services:
  mongo:
    image: mongo:7
    container_name: noffelo-mongo
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

  pinecone-local:
    image: ghcr.io/pinecone-io/pinecone-local:latest
    container_name: noffelo-pinecone-local
    platform: linux/amd64
    environment:
      PORT: 5080
      PINECONE_HOST: pinecone-local
    ports:
      - "5080-5090:5080-5090"
    restart: unless-stopped

  server:
    build:
      context: ./server
    container_name: noffelo-server
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: development
      PORT: 5000
      MONGO_URI: mongodb://mongo:27017/noffelo
      JWT_SECRET: "${JWT_SECRET:-}"
      NOFFELO_ADMIN_SESSION_SECRET: "${NOFFELO_ADMIN_SESSION_SECRET:-change-this-development-jwt-secret}"
      JWT_EXPIRES_IN: "${JWT_EXPIRES_IN:-12h}"
      CUSTOMER_JWT_SECRET: "${CUSTOMER_JWT_SECRET:-}"
      CUSTOMER_JWT_EXPIRES_IN: "${CUSTOMER_JWT_EXPIRES_IN:-7d}"
      ADMIN_EMAIL: "${ADMIN_EMAIL:-admin@noffelo.local}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:-}"
      NOFFELO_ADMIN_PASSWORD: "${NOFFELO_ADMIN_PASSWORD:-Admin@12345}"
      CLIENT_ORIGINS: "${CLIENT_ORIGINS:-}"
      NOFFELO_CORS_ORIGINS: "${NOFFELO_CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}"
      WHATSAPP_NUMBER: "${WHATSAPP_NUMBER:-}"
      NOFFELO_WHATSAPP_NUMBER: "${NOFFELO_WHATSAPP_NUMBER:-923001234567}"
      RESERVATION_SLOT_CAPACITY: "${RESERVATION_SLOT_CAPACITY:-20}"
      CLIENT_URL: "${CLIENT_URL:-http://localhost:5173}"
      SMTP_HOST: "${SMTP_HOST:-}"
      SMTP_PORT: "${SMTP_PORT:-587}"
      SMTP_SECURE: "${SMTP_SECURE:-false}"
      SMTP_USER: "${SMTP_USER:-}"
      SMTP_PASS: "${SMTP_PASS:-}"
      MAIL_FROM: "${MAIL_FROM:-}"
      RATE_LIMIT_RPM: "${RATE_LIMIT_RPM:-}"
      NOFFELO_RATE_LIMIT_RPM: "${NOFFELO_RATE_LIMIT_RPM:-180}"
      MAX_BODY_BYTES: "${MAX_BODY_BYTES:-}"
      NOFFELO_MAX_BODY_BYTES: "${NOFFELO_MAX_BODY_BYTES:-128kb}"
      USE_LOCAL_VECTORS: "${USE_LOCAL_VECTORS:-true}"
      VECTOR_STORE: "${VECTOR_STORE:-pinecone-local}"
      PINECONE_API_KEY: "${PINECONE_API_KEY:-pclocal}"
      PINECONE_INDEX_NAME: "${PINECONE_INDEX_NAME:-noffelo-cafe}"
      PINECONE_HOST: "${PINECONE_HOST:-http://pinecone-local:5080}"
      PINECONE_CLOUD: "${PINECONE_CLOUD:-aws}"
      PINECONE_REGION: "${PINECONE_REGION:-us-east-1}"
      VECTOR_DIMENSION: "${VECTOR_DIMENSION:-384}"
      PINECONE_CREATE_INDEX: "${PINECONE_CREATE_INDEX:-true}"
      GROQ_API_KEY: "${GROQ_API_KEY:-}"
      GROQ_CUSTOMER_MODEL: "${GROQ_CUSTOMER_MODEL:-llama-3.1-8b-instant}"
      GROQ_ADMIN_MODEL: "${GROQ_ADMIN_MODEL:-llama-3.3-70b-versatile}"
      GROQ_CUSTOMER_TEMPERATURE: "${GROQ_CUSTOMER_TEMPERATURE:-0.7}"
      GROQ_ADMIN_TEMPERATURE: "${GROQ_ADMIN_TEMPERATURE:-0.3}"
      GROQ_CUSTOMER_MAX_TOKENS: "${GROQ_CUSTOMER_MAX_TOKENS:-500}"
      GROQ_ADMIN_MAX_TOKENS: "${GROQ_ADMIN_MAX_TOKENS:-1000}"
    depends_on:
      - mongo
      - pinecone-local
    restart: unless-stopped

  client:
    build:
      context: ./client
    container_name: noffelo-client
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: "${VITE_API_URL:-http://localhost:5000/api}"
      VITE_WHATSAPP_NUMBER: "${WHATSAPP_NUMBER:-923001234567}"
    depends_on:
      - server
    restart: unless-stopped

volumes:
  mongo_data:
